<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRP ダッシュボード</title>
<style>
  :root {
    --bg: #f3f2ef; --bg-elevated: #ffffff; --bg-sunken: #eae9e5;
    --border: #d6d4cd; --border-strong: #17171a;
    --text: #17171a; --text-muted: #55534e; --text-faint: #7a7972;
    --accent: #2955a6;
    --good: #1f6b4d; --good-bg: #e2eee8; --good-line: #2f9268;
    --warn: #7d5800; --warn-bg: #f8f0d8; --warn-line: #c9971a;
    --bad:  #9c3419; --bad-bg:  #f5e2dd; --bad-line:  #cf4b30;
    --idle: #55534e; --idle-bg: #eae9e5; --idle-line: #9a988f;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0b; --bg-elevated: #16161a; --bg-sunken: #000000;
      --border: #2e2d33; --border-strong: #f8f8f6;
      --text: #f8f8f6; --text-muted: #b3b2b8; --text-faint: #85848b;
      --accent: #6ea8ff;
      --good: #6fd3a2; --good-bg: #14251d; --good-line: #3f9a72;
      --warn: #e8c46a; --warn-bg: #272014; --warn-line: #b98f2b;
      --bad:  #ef8f7d; --bad-bg:  #2b1714; --bad-line:  #b6503a;
      --idle: #b3b2b8; --idle-bg: #1f1f24; --idle-line: #6d6c73;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0b; --bg-elevated: #16161a; --bg-sunken: #000000;
    --border: #2e2d33; --border-strong: #f8f8f6;
    --text: #f8f8f6; --text-muted: #b3b2b8; --text-faint: #85848b;
    --accent: #6ea8ff;
    --good: #6fd3a2; --good-bg: #14251d; --good-line: #3f9a72;
    --warn: #e8c46a; --warn-bg: #272014; --warn-line: #b98f2b;
    --bad:  #ef8f7d; --bad-bg:  #2b1714; --bad-line:  #b6503a;
    --idle: #b3b2b8; --idle-bg: #1f1f24; --idle-line: #6d6c73;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
  .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  h2 { font-size: 12px; font-family: var(--mono); font-weight: 600; letter-spacing: .08em; color: var(--text-muted); margin: 0 0 12px; }

  header.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; flex-wrap: wrap; }
  .brand { font-family: var(--mono); font-weight: 700; letter-spacing: .06em; }
  .brand::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text); margin-right: 8px; vertical-align: 1px; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--text-faint); flex: 1; min-width: 0; }
  .refresh { font: inherit; font-family: var(--mono); font-size: 12px; color: var(--text); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .refresh:disabled { opacity: .5; cursor: default; }

  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 12px; }

  /* 今の値段と損益 */
  .price-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .price { font-family: var(--mono); font-size: 40px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .price-jpy { font-family: var(--mono); color: var(--text-muted); font-size: 15px; }
  .chips { display: flex; gap: 6px; margin-left: auto; }
  .chip { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--idle-bg); color: var(--idle); white-space: nowrap; }
  .chip.good { background: var(--good-bg); color: var(--good); }
  .chip.bad  { background: var(--bad-bg);  color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .spark { margin: 14px 0 4px; }
  .spark svg { display: block; width: 100%; height: 90px; }
  .spark-legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .spark-legend i { display: inline-block; width: 12px; height: 8px; margin-right: 5px; vertical-align: 0; }
  .kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 14px; }
  .kv > div { background: var(--bg-elevated); padding: 10px 12px; min-width: 0; }
  .kv .k { font-size: 11px; color: var(--text-faint); }
  .kv .v { font-family: var(--mono); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv .s { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  /* 今やること */
  .status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; border-left: 4px solid var(--idle-line); background: var(--idle-bg); }
  .status.good { border-color: var(--good-line); background: var(--good-bg); }
  .status.warn { border-color: var(--warn-line); background: var(--warn-bg); }
  .status.bad  { border-color: var(--bad-line);  background: var(--bad-bg); }
  .status b { font-size: 17px; }
  .status span { color: var(--text-muted); font-size: 13.5px; }
  .lines { margin: 12px 0 0; padding: 0; list-style: none; }
  .lines li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--border); font-size: 14px; }
  .lines li:first-child { border-top: 0; }
  .lines .k { flex: 0 0 7.5em; color: var(--text-faint); font-size: 12.5px; padding-top: 1px; }
  .lines .v { flex: 1; min-width: 0; }
  .ladder-mini { font-family: var(--mono); font-size: 13px; }
  .ladder-mini { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 12px; }
  .ladder-mini .passed { color: var(--text-faint); }
  .ladder-mini .tag { font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .stance { margin-top: 12px; font-size: 13.5px; color: var(--text-muted); }

  /* 要点・一覧 */
  .item { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--idle-line); }
  .dot.good { background: var(--good-line); } .dot.warn { background: var(--warn-line); } .dot.bad { background: var(--bad-line); }
  .item.plain .t { font-weight: 400; }
  .item .t { font-weight: 700; font-size: 14.5px; line-height: 1.45; min-width: 0; }
  .item .d { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); white-space: nowrap; padding-top: 2px; }
  .item .x { grid-column: 2 / 4; font-size: 13px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item.open .x { -webkit-line-clamp: unset; display: block; }
  .item .x a { white-space: nowrap; }

  /* AIの見立て */
  .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .view { border: 1px solid var(--border); border-radius: 6px; padding: 12px; min-width: 0; }
  .view-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .view-name { font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .view-at { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-left: auto; white-space: nowrap; }
  .view-at.old { color: var(--warn); }
  .view-head { font-weight: 700; font-size: 14.5px; line-height: 1.5; }
  .view ul { margin: 6px 0 0; padding-left: 1.1em; font-size: 13px; color: var(--text-muted); }
  .view li { margin: 2px 0; }
  .view-risk { margin-top: 6px; font-size: 13px; color: var(--text-muted); }
  .view-risk b { color: var(--warn); font-weight: 600; }
  .view-empty { font-size: 13px; color: var(--text-faint); }
  .views-diff { margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }

  details.more { margin-top: 4px; }
  details.more > summary { list-style: none; cursor: pointer; text-align: center; font-family: var(--mono); font-size: 13px; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-muted); }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: " ▼"; }
  details.more[open] > summary::after { content: " ▲"; }
  details.more[open] > summary { margin-bottom: 12px; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; font-family: var(--mono); }
  th { font-family: var(--sans); font-weight: 600; font-size: 11.5px; color: var(--text-faint); }
  th:first-child, td:first-child { text-align: left; }
  tr.sum td { font-weight: 700; border-bottom: 0; }
  h3 { font-size: 13px; margin: 18px 0 6px; color: var(--text-muted); }
  h3:first-child { margin-top: 0; }

  footer { font-size: 12px; color: var(--text-faint); margin-top: 20px; line-height: 1.7; }

  @media (max-width: 560px) {
    .price { font-size: 34px; }
    .chips { margin-left: 0; width: 100%; }
    .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lines .k { flex-basis: 6.5em; }
    .views { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">XRP</div>
    <div class="meta" id="meta"></div>
    <button type="button" class="refresh" id="refresh">↻ 価格を更新</button>
  </header>

  <section class="card" aria-labelledby="h-now">
    <h2 id="h-now">今の値段と損益</h2>
    <div class="price-row">
      <div class="price" id="price">—</div>
      <div class="price-jpy" id="priceJpy"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="spark" id="spark" hidden></div>
    <div class="kv" id="kv"></div>
  </section>

  <section class="card" aria-labelledby="h-todo">
    <h2 id="h-todo">今やること</h2>
    <div class="status" id="status"></div>
    <ul class="lines" id="lines"></ul>
    <div class="stance" id="stance"></div>
  </section>

  <section class="card" aria-labelledby="h-points">
    <h2 id="h-points">今日の要点</h2>
    <div id="points"></div>
  </section>

  <section class="card" aria-labelledby="h-views">
    <h2 id="h-views">AIの見立て</h2>
    <div class="views" id="views"></div>
    <div class="views-diff" id="viewsDiff" hidden></div>
  </section>

  <details class="more">
    <summary>詳しく見る（イベント・材料一覧・ニュース・保有の内訳）</summary>
    <section class="card">
      <h2>今週のイベント</h2>
      <div id="events"></div>
    </section>
    <section class="card">
      <h2>材料一覧（新しい順）</h2>
      <div id="impacts"></div>
    </section>
    <section class="card">
      <h2>海外ニュース</h2>
      <div id="news"></div>
    </section>
    <section class="card">
      <h2>保有の内訳</h2>
      <div id="holdDetail"></div>
    </section>
  </details>

  <footer>
    投資助言ではありません。数字は目安で、判断と執行はご自身で行ってください。
    材料・ニュースは毎日 03:00 / 09:00 / 20:00 JST に自動更新、価格はページを開いたときに CoinGecko から取得します。
    過去の分析は <a href="https://github.com/ryonosukeuzuahra/UzU/blob/main/XRP_Strategy_Report.md">レポート</a> と GitHub の履歴にあります。
  </footer>
</div>

    {"date":"2026-10-15","tier":"good","t":"x402 Foundation参加 & Ripple Prime機関基盤拡大","s":53,"d":"up","status":"kucoin.com・theblock.co・news.bitcoin.com・cryptopotato.com・cryptoticker.ioは10/15、Ripple Primeが100以上の参照市場(株式・株価指数・ETF・貴金属・エネルギー・為替)を対象に24時間365日取引可能なRWA(現実資産)永久スワップを開始したと報道。Hyperliquid上でTrade.xyzが上場する永久先物を参照し、Ripple Primeが取引相手として機能、担保には(法域により利用可否は異なるものの)RLUSDも利用可能という。マーケットメイカーVirtu Americasが早期採用クライアントとして取引を開始したと伝えられる(kucoin.com、theblock.co、news.bitcoin.com、cryptopotato.com、複数データソース照会、10/15)。crypto.news・coindoo.comは8/28、Ripple PrimeがWall Street型の「Delta One」事業を立ち上げ、米国株・株価指数・暗号資産を横断するトータルリターンスワップを機関投資家向けに提供開始したと報道、規制資本$1B超を裏付けにヘッジファンド・資産運用会社を主要顧客に据え、既存プライムブローカーに対抗する狙いと伝えた(crypto.news、coindoo.com、8/28)。AIエージェント決済が140万件超に拡大、Ripple Prime収益は買収後3倍(Benzinga、7/21)。coindesk.com・ripple.comは8/19、Ripple Primeが償還2031年・クーポン8.25%の優先無担保社債$275Mを私募発行しKBRAから投資適格のBBB格付けを取得したと報道、5月のNeuberger Specialty Financeからの$2億与信枠に続く伝統的な社債による資金調達で米国プライムブローカレッジ事業を拡大すると伝えた(coindesk.com、ripple.com、8/19)","desc":"RippleがVisa・Mastercard等と並ぶプレミアムメンバーとして参画したAIエージェント決済規格「x402」は、XRPL AI Starter Kit公開から4週間で140万件超のエージェント決済(1件$0.0002)を記録。7/20にはJPMorgan・Mastercard・Ondo Financeとの提携で、Ondoの短期米国債ファンド(OUSG)をXRPレジャー上でトークン化しほぼリアルタイムのクロスボーダー償還を行うパイロットを完了(JPMorganのKinexysが法定通貨側を処理、CryptoSlate)。機関向けブローカレッジ子会社Ripple Prime(旧Hidden Road)は買収後に収益が3倍に伸び年間清算高は$3兆を突破、機関顧客300超の規模に。国際CEOのMichael Higgins氏は担保・流動性・決済がブロックチェーン網へ移行する「ウォール街2.0」の基盤構築を進めていると発言、Neuberger Specialty Financeから$2億の与信枠も確保(Benzinga、7/21)。新設の「XRP担保証書」により機関投資家はXRPを売却せずCME先物などの米ドル建て信用枠を確保できるようになり、XRPが決済資産から機関担保資産へと用途を広げつつある。Rippleは7/22、CNBC/Statista「世界のフィンテック企業トップ」に4年連続で選出された。英大手資産運用会社Aviva Investorsは7/29、RippleおよびKomainu(カストディ)・Licuido(トークナイゼーション基盤)と組みUSD Liquidity FundのトークナイズドシェアクラスをXRPレジャー上で稼働、資産はBNY Mellonが保管し、アイルランド中央銀行が承認した初のトークン化ファンド構造として他の資産運用会社への先例となった(crypto.news、cryptonews.net、7/29)。CoinDesk・Ripple公式は8/19、Ripple Primeが米国プライムブローカレッジ事業拡大の資金として、Piper Sandlerを主幹事に償還2031年・クーポン8.25%の優先無担保社債$275Mを私募発行し、KBRAから投資適格のBBB格付けを取得したと報道。トークン発行ではなく通常の社債による資金調達である点が特徴で、5     return `<div class="view"><div class="view-top"><span class="view-name">${name}</span><span class="chip ${t}">${label}</span>` +
      `<span class="view-at${old ? ' old' : ''}">${esc(dateLabel(day))}${/\d{2}:\d{2}/.test(at) ? ' ' + esc(at.slice(11, 16)) : ''}${old ? ' 古い' : ''}</span></div>` +
      `<div class="view-head">${esc(v.head)}</div>` +
      (reasons.length ? `<ul>${reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '') +
      (v.risk ? `<div class="view-risk"><b>注意</b> ${esc(v.risk)}</div>` : '') + `</div>`;
  }
  function renderViews(){
    const cMsg = codexState === 'loading' ? '読み込み中…' : 'まだありません（毎朝 9:30 ごろ、PC が起動していれば更新されます）';
    $('views').innerHTML = viewHtml('Claude', CLAUDE_VIEW, 'まだありません') + viewHtml('Codex', codexView, cMsg);
    const a = validView(CLAUDE_VIEW) && CLAUDE_VIEW.stance, b = validView(codexView) && codexView.stance;
    const diff = a && b && VIEW_STANCE[a] && VIEW_STANCE[b] && a !== b;
    $('viewsDiff').hidden = !diff;
    if (diff) $('viewsDiff').textContent = `意見が分かれています（Claude ${VIEW_STANCE[a][1]}・Codex ${VIEW_STANCE[b][1]}）。理由を見比べてください。`;
  }
  async function loadCodex(){
    try { const v = await getJSON('codex.json?t=' + Date.now()); codexView = validView(v) ? v : null; }
    catch (e) { codexView = null; }
    codexState = 'done';
    renderViews();
  }

  function renderHoldDetail(){
    const fx = fxNow();
    let html = '';
    if (EXEC.length) {
      html += `<h3>買った記録</h3><div class="tbl"><table><tr><th>日時</th><th>数量</th><th>単価</th><th>手数料</th><th>金額</th></tr>` +
        EXEC.map(e => `<tr><td>${esc(e.date)}</td><td>${xrp(e.qty)}</td><td>${jpy(e.jpy)}</td><td>${jpy(e.fee || 0)}</td><td>${jpy(e.qty * e.jpy + (e.fee || 0))}</td></tr>`).join('') +
        `<tr class="sum"><td>合計</td><td>${xrp(execQty)}</td><td>${jpy(execCost / execQty)}</td><td></td><td>${jpy(execCost)}</td></tr></table></div>`;
    }
    if (H.buyLadder && H.buyLadder.length) {
      const no = H.ladderNo || 0;
      html += `<h3>残りの買い（現金 ${jpy(H.cashJpy)}）</h3><div class="tbl"><table><tr><th>段</th><th>投入額</th><th>指値帯</th><th>取得見込</th></tr>` +
        H.buyLadder.map((b, i) => `<tr><td>第${i + 1 + no}段${b.cond ? '(条件付)' : ''}</td><td>${jpy(b.jpy)}</td><td>${usd2(b.lo)}〜${usd2(b.hi)}</td><td>${xrp(b.jpy / fx / ((b.lo + b.hi) / 2))}</td></tr>`).join('') +
        `</table></div>`;
    }
    if (H.ladder && H.ladder.length) {
      let left = H.xrp, got = 0;
      html += `<h3>利確の計画</h3><div class="tbl"><table><tr><th>到達価格</th><th>売る割合</th><th>数量</th><th>受取（概算）</th><th>残り</th></tr>` +
        H.ladder.map(l => { const q = H.xrp * l.pct / 100; left -= q; got += q * l.px;
          return `<tr><td>${usd2(l.px)}</td><td>${l.pct}%</td><td>${xrp(q)}</td><td>${jpy(q * l.px * fx)}</td><td>${xrp(left)}</td></tr>`; }).join('') +
        `<tr class="sum"><td>合計</td><td></td><td></td><td>${jpy(got * fx)}</td><td></td></tr></table></div>`;
    }
    $('holdDetail').innerHTML = html;
  }

  function renderMeta(){
    const t = live.at ? `価格 ${live.at.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 取得` : '価格は日次データ';
    $('meta').textContent = `材料 ${UPDATED} 更新 ・ ${t}`;
  }

  function renderAll(){ renderMeta(); renderNow(); renderTodo(); renderHoldDetail(); }

  async function getJSON(url){
    const c = new AbortController(), timer = setTimeout(() => c.abort(), 8000);
    try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }
    finally { clearTimeout(timer); }
  }
  const CG = 'https://api.coingecko.com/api/v3/';
  // 呼び出しは2回だけ(無料枠の回数制限に当たりにくくする)。7日の変化は同時に取った30日の推移から出す
  async function fetchLive(){
    const btn = $('refresh');
    btn.disabled = true;
    try {
      const [p, c] = await Promise.allSettled([
        getJSON(CG + 'simple/price?ids=ripple&vs_currencies=usd,jpy&include_24hr_change=true'),
        getJSON(CG + 'coins/ripple/market_chart?vs_currency=usd&days=30'),
      ]);
      const r = p.status === 'fulfilled' && p.value && p.value.ripple;
      if (r && okNum(r.usd)) {
        live.usd = r.usd; live.jpy = okNum(r.jpy) ? r.jpy : null;
        live.chg24 = typeof r.usd_24h_change === 'number' ? r.usd_24h_change : null;
        live.at = new Date();
      }
      const raw = c.status === 'fulfilled' && c.value && Array.isArray(c.value.prices) ? c.value.prices : [];
      const series = raw.filter(x => Array.isArray(x) && isFinite(x[0]) && okNum(x[1]));
      if (series.length >= 2) {
        live.series = series;
        const last = series[series.length - 1], wk = last[0] - 7 * 864e5;
        const ref = series.reduce((a, b) => Math.abs(b[0] - wk) < Math.abs(a[0] - wk) ? b : a);
        live.chg7 = (last[1] / ref[1] - 1) * 100;
        renderSpark();
      }
    } catch (e) {
      /* 取れなければ日次データのまま */
    } finally {
      renderAll();
      btn.disabled = false;
    }
  }

  renderLists();
  renderAll();
  renderViews();
  loadCodex();
  $('refresh').addEventListener('click', fetchLive);
  fetchLive();
})();
</script>
</body>
</html>
